apiVersion: apps/v1
kind: Deployment
metadata: {name: twin-service, namespace: twin-research}
spec:
  replicas: 1
  selector: {matchLabels: {app: twin-service}}
  template:
    metadata: {labels: {app: twin-service}}
    spec:
      terminationGracePeriodSeconds: 5
      containers:
      - name: service
        image: python:3.12-alpine
        command: [python, -u, /app/service.py]
        env: [{name: STARTUP_DELAY, value: '5'}]
        ports: [{containerPort: 8080}]
        resources:
          requests: {cpu: 250m, memory: 96Mi}
          limits: {cpu: 500m, memory: 192Mi}
        readinessProbe:
          httpGet: {path: /health, port: 8080}
          periodSeconds: 2
          failureThreshold: 30
        volumeMounts: [{name: source, mountPath: /app, readOnly: true}]
      volumes:
      - name: source
        configMap: {name: twin-service}
---
apiVersion: v1
kind: Service
metadata: {name: twin-service, namespace: twin-research}
spec:
  type: NodePort
  selector: {app: twin-service}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30081}]
