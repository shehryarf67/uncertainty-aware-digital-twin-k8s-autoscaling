apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: cpu-hpa, namespace: guruge-repro}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: sample-api}
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: {type: Utilization, averageUtilization: 70}
