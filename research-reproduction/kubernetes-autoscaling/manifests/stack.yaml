apiVersion: v1
kind: Namespace
metadata:
  name: guruge-repro
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-api
  namespace: guruge-repro
spec:
  replicas: 1
  selector:
    matchLabels: {app: sample-api}
  template:
    metadata:
      labels: {app: sample-api}
    spec:
      containers:
      - name: api
        image: pasanbhanu/springboot-sample-api-with-prometheus:latest
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8080}]
        resources:
          requests: {cpu: 250m, memory: 384Mi}
          limits: {cpu: 500m, memory: 512Mi}
        readinessProbe:
          httpGet: {path: /actuator/health, port: 8080}
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sample-api
  namespace: guruge-repro
spec:
  type: NodePort
  selector: {app: sample-api}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30080}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: guruge-repro
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
    - job_name: springbootapi-service
      metrics_path: /actuator/prometheus
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [guruge-repro]
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: sample-api
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: '8080'
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: guruge-repro}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: prometheus, namespace: guruge-repro}
rules:
- apiGroups: ['']
  resources: [pods]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: prometheus, namespace: guruge-repro}
subjects: [{kind: ServiceAccount, name: prometheus}]
roleRef: {kind: Role, name: prometheus, apiGroup: rbac.authorization.k8s.io}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: guruge-repro}
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v2.55.1
        ports: [{containerPort: 9090}]
        args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=2h]
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
        volumeMounts: [{name: config, mountPath: /etc/prometheus}]
      volumes: [{name: config, configMap: {name: prometheus-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: guruge-repro}
spec:
  type: NodePort
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: 9090, nodePort: 30909}]
