apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: {name: author-forecast, namespace: guruge-repro}
spec:
  scaleTargetRef: {name: sample-api}
  pollingInterval: 60
  cooldownPeriod: 30
  minReplicaCount: 1
  maxReplicaCount: 10
  fallback: {failureThreshold: 3, replicas: 1}
  triggers:
  - type: external
    metricType: AverageValue
    metadata:
      scalerAddress: author-scaler.guruge-repro.svc.cluster.local:50051
      serverAddress: http://172.22.34.7:30909
      query: sum(rate(http_server_requests_seconds_count{job="springbootapi-service"}[1m]))
      podLimit: '1000'
      scaleFactor: '100'
      activationValue: '10'
